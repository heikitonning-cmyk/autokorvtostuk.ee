name: Work app CI

on:
  push:
    branches:
      - app-v1-build
    paths:
      - 'work-app/**'
      - '.github/workflows/work-app-ci.yml'
  pull_request:
    paths:
      - 'work-app/**'
      - '.github/workflows/work-app-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:cf
